{% extends "base.html" %}
{% block titulo %}Entrar · Manual do Desenvolvedor{% endblock %}
{% block conteudo %}
<section class="cartao formulario-estreito">
  <h1>Entrar</h1>
  <p class="subtitulo">Rastreabilidade entre requisitos, casos de teste e código-fonte.</p>
  {% if erro %}<div class="alerta alerta-erro">{{ erro }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>E-mail
      <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
    </label>
    <label>Senha
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <label class="caixa"><input type="checkbox" name="lembrar" value="1"> Manter conectado</label>
    <button type="submit" class="botao botao-largo">Entrar</button>
  </form>
  <p class="rodape-formulario">Ainda não tem conta? <a href="{{ url_for('auth.cadastrar') }}">Cadastre-se</a></p>
</section>
{% endblock %}
